<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | BusyBagz</title>
  <meta name="description" content="Discover custom bags, store services, delivery, and pre-order products from BusyBagz stores.">
  <link rel="canonical" href="https://busybagz.com/store/UBEC%20Gigcase">
  <meta property="og:type" content="website">
  <meta property="og:title" content="UBEC Gigcase | BusyBagz">
  <meta property="og:description" content="Custom bags, in-store shopping, delivery, and pre-order products from UBEC Gigcase.">
  <meta property="og:url" content="https://busybagz.com/store/UBEC%20Gigcase">
  <meta property="og:image" content="https://res.cloudinary.com/sjnrfmjm/image/upload/v1788515161/gigcase_logo.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7446487671504565" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { padding: 112px 20px 48px; background: #f7f5f0; }
    .store-page { width: min(100%, 980px); margin: 0 auto; }
    .store-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 2rem; align-items: start; }
    .store-column { min-width: 0; }
    .store-hero { overflow: hidden; border-radius: 18px; background: white; box-shadow: 0 18px 38px rgba(41, 67, 154, 0.12); }
    .store-ad-rail { position: sticky; top: 6rem; align-self: start; }
    .store-banner { width: 100%; height: min(42vw, 360px); min-height: 220px; object-fit: cover; display: block; }
    .store-content { padding: clamp(24px, 5vw, 52px); }
    .store-content h1 { margin: 8px 0 10px; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; }
    .store-content h2 { margin: 1.5rem 0 0.75rem; font-size: 1.05rem; color: #17362b; }
    .store-category { margin: 0; color: #1b8f66; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.78rem; }
    .store-description { max-width: 650px; color: #53608a; line-height: 1.7; }
    .store-details-list { margin: 0; padding-left: 1.2rem; color: #2c415f; line-height: 1.8; }
    .store-reservation { margin: 24px 0; font-weight: 700; }
    .store-reservation a { color: #1b8f66; }
    .store-reservation a:hover { text-decoration: underline; }
    .store-back { display: inline-flex; margin-top: 20px; padding: 11px 16px; border-radius: 8px; background: #1b8f66; color: white; font-weight: 700; }
    .store-products { margin-top: 28px; }
    .store-products h2 { margin: 0 0 14px; color: #17362b; }
    .store-product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .store-product-card { overflow: hidden; border: 1px solid rgba(23, 54, 43, 0.16); border-radius: 12px; background: white; color: #17362b; }
    .store-product-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .store-product-card-content { padding: 14px 16px 16px; }
    .store-product-card h3 { margin: 0 0 5px; font-size: 1rem; }
    .store-product-card p { margin: 0; color: #1b8f66; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .store-product-card:hover { border-color: #1b8f66; box-shadow: 0 10px 22px rgba(23, 54, 43, 0.1); }
    .store-missing { padding: 48px 24px; text-align: center; }
    .store-missing h1 { margin-top: 0; }
    .store-address { margin-top: 1rem; color: #2c415f; }
    .store-address a { color: #17362b; }
    @media (max-width: 1024px) {
      .store-layout { grid-template-columns: 1fr; }
      .store-ad-rail { position: static; }
    }
    @media (max-width: 768px) {
      body { padding: 120px 12px 32px; }
      .store-page { width: min(100%, 100%); }
      .store-content { padding: 1.25rem 1rem 1.5rem; }
      .store-banner { min-height: 180px; }
      .store-product-grid { grid-template-columns: 1fr; }
      .store-hero { border-radius: 14px; }
      .store-ad-rail { margin-top: 1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <a href="/index.html" class="nav-logo" aria-label="BusyBagz home">
      <img src="https://res.cloudinary.com/sjnrfmjm/image/upload/v1788502910/busyBagz.png" alt="BusyBagz logo" class="brand-logo-image">
    </a>
    <a href="/index.html" class="nav-cart" aria-label="Back to storefront">Storefront</a>
  </nav>

  <main class="store-page">
    <div class="store-layout">
      <div class="store-column" id="storePage"></div>

      <aside class="ad-rail store-ad-rail" aria-label="Sponsored content">
        <p class="ad-rail-label">Sponsored</p>
        <ins class="adsbygoogle ad-slot ad-slot-featured"
          style="display:block"
          data-ad-client="ca-pub-7446487671504565"
          data-ad-slot="9568789244"
          data-ad-format="auto"
          data-full-width-responsive="true"></ins>
        <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
        <a class="ad-slot ad-slot-featured" href="#" data-ad-slot="featured">
          <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=480&h=320&fit=crop&q=80" alt="Travel bag collection">
          <span class="ad-slot-content">
            <small>Featured partner</small>
            <strong>Gear up for your next trip</strong>
            <span>Promote your brand here</span>
          </span>
        </a>
        <a class="ad-slot ad-slot-secondary" href="#" data-ad-slot="secondary">
          <span class="ad-slot-content">
            <small>Sponsored</small>
            <strong>Reach BusyBagz shoppers</strong>
            <span>Your campaign could be here</span>
          </span>
        </a>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2026 BusyBagz. All rights reserved.</p>
      <div class="footer-legal">
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/terms.html">Terms and Conditions</a>
      </div>
    </div>
  </footer>

  <script>
    const STORES_STORAGE_KEY = 'busybagz-stores';
    const DEFAULT_STORES = [{
      id: 'ubec-gigcase',
      name: 'UBEC Gigcase',
      category: 'Custom Bags',
      description: 'Custom bags that are hard to find in malls or stores.',
      image: 'https://res.cloudinary.com/sjnrfmjm/image/upload/v1788515161/gigcase_logo.jpg',
      specialties: ['Bike bag', 'Guitar bag', 'Free dive bag', 'Moto bag', 'Custom Pickle Ball bags', 'Other custom bags'],
      services: ['In-store shopping', 'Special Discount', 'Delivery', 'COD around Cebu city'],
      facebookUrl: 'https://www.facebook.com/Ubecgigcase',
      address: 'Sangi gate Barangay, Pajo, Lapu-Lapu City, Philippines, 6015',
      addressUrl: 'https://www.bing.com/maps/default.aspx?v=2&pc=FACEBK&mid=8100&where1=Sangi%20gate%20Barangay%2C%20Pajo%2C%20Lapu-Lapu%20City%2C%20Philippines%2C%206015&FORM=FBKPL1&mkt=en-GB&fbclid=IwcGRvZgFleHRuA2FlbQIxMABicmlkETEwZ08zVkh6Rk1TNVhMM1Flc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHuh33clNJI1g7nH_k4ggusO327iyq-f4tHzwXUbCvAzK-eiCukeldPHoj9gv_aem_BxufZ66sKpyOwh2ohDdG2A'
    }];
    const fallbackImage = 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=1200&h=600&fit=crop&q=80';
    const storePage = document.getElementById('storePage');

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      })[character]);
    }

    function getStores() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORES_STORAGE_KEY) || '[]');
        const savedStores = (Array.isArray(stored) ? stored : []).filter(store => store.id !== 'busyReviewer' && store.name !== 'busyReviewer' && store.name.toLowerCase() !== 'gigcase');
        return [...DEFAULT_STORES, ...savedStores.filter(store => !DEFAULT_STORES.some(defaultStore => defaultStore.name === store.name))];
      } catch {
        return DEFAULT_STORES;
      }
    }

    const storeName = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '');
    const store = getStores().find(item => item.name === storeName);

    if (!store) {
      document.title = 'Store not found | BusyBagz';
      storePage.innerHTML = '<section class="store-hero store-missing"><h1>Store not found</h1><p>That BusyBagz store is no longer available.</p><a class="store-back" href="/index.html">Back to storefront</a></section>';
    } else {
      document.title = `${store.name} | BusyBagz`;
      const productOffers = [
        { name: 'Transparent bag', url: '/pdp.html?id=5', price: 'Pre-order' },
        { name: 'Pickle Bag', url: '/pdp.html?id=6', price: 'Pre-order' }
      ];

      const structuredData = {
        '@context': 'https://schema.org',
        '@type': 'Store',
        name: store.name,
        description: store.description,
        image: store.image || fallbackImage,
        url: `https://busybagz.com/store/${encodeURIComponent(store.name)}`,
        address: {
          '@type': 'PostalAddress',
          streetAddress: store.address,
          addressCountry: 'PH'
        },
        sameAs: store.facebookUrl ? [store.facebookUrl] : [],
        makesOffer: productOffers.map(product => ({
          '@type': 'Offer',
          itemOffered: {
            '@type': 'Product',
            name: product.name,
            url: `https://busybagz.com${product.url}`,
            category: store.category,
            offers: {
              '@type': 'Offer',
              price: '0',
              priceCurrency: 'PHP',
              availability: 'https://schema.org/InStock'
            }
          }
        }))
      };

      const jsonLd = document.createElement('script');
      jsonLd.type = 'application/ld+json';
      jsonLd.textContent = JSON.stringify(structuredData);
      document.head.appendChild(jsonLd);

      storePage.innerHTML = `
        <article class="store-hero">
          <img class="store-banner" src="${escapeHTML(store.image || fallbackImage)}" alt="${escapeHTML(store.name)} banner">
          <div class="store-content">
            <p class="store-category">${escapeHTML(store.category || 'BusyBagz store')}</p>
            <h1>${escapeHTML(store.name)}</h1>
            <p class="store-description">${escapeHTML(store.description || 'Welcome to this BusyBagz store.')}</p>
            ${store.specialties ? `<h2>Specialties</h2><ul class="store-details-list">${store.specialties.map(item => `<li>${escapeHTML(item)}</li>`).join('')}</ul>` : ''}
            ${store.services ? `<h2>Store services</h2><ul class="store-details-list">${store.services.map(item => `<li>${escapeHTML(item)}</li>`).join('')}</ul>` : ''}
            ${store.facebookUrl ? `<p class="store-reservation"><a href="${escapeHTML(store.facebookUrl)}" target="_blank" rel="noopener noreferrer">DM us to reserve yours today! 📩</a></p>` : ''}
            ${store.address ? `<p class="store-address"><a href="${escapeHTML(store.addressUrl)}" target="_blank" rel="noopener noreferrer">${escapeHTML(store.address)}</a></p>` : ''}
            <a class="store-back" href="/index.html">Back to storefront</a>
          </div>
        </article>
        ${store.id === 'ubec-gigcase' ? `
          <section class="store-products" aria-labelledby="store-products-title">
            <h2 id="store-products-title">Products</h2>
            <div class="store-product-grid">
              <a class="store-product-card" href="/pdp.html?id=5">
                <img src="https://res.cloudinary.com/sjnrfmjm/image/upload/v1788513590/gigcase_bag_1.jpg" alt="Transparent bag">
                <div class="store-product-card-content"><h3>Transparent bag</h3><p>Pre-order</p></div>
              </a>
              <a class="store-product-card" href="/pdp.html?id=6">
                <img src="https://res.cloudinary.com/sjnrfmjm/image/upload/v1788514705/gigcase_bag_2_1.jpg" alt="Pickle Bag">
                <div class="store-product-card-content"><h3>Pickle Bag</h3><p>Pre-order</p></div>
              </a>
            </div>
          </section>` : ''}`;
    }
  </script>
</body>
</html>
