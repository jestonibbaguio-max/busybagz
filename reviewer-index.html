<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BusyBagz Reviewers</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7446487671504565" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #fffaf5;
      --ink: #1d1a2b;
      --muted: #6d6780;
      --brand: #1d1d3a;
      --accent: #ff6b57;
      --line: rgba(29, 29, 58, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px 72px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    .page-shell { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      padding: 18px 22px;
      border-radius: 20px;
      background: var(--brand);
      color: white;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #f9d77a;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -0.12em;
    }

    .brand-name { font-size: 1.25rem; }

    .nav-link {
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 24px;
      align-items: start;
    }

    main,
    .ads {
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: white;
      box-shadow: 0 20px 48px rgba(29, 29, 58, 0.1);
    }

    .ads {
      padding: 20px;
      position: sticky;
      top: 24px;
      text-align: center;
    }

    .ads-label {
      display: block;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .ad-slot {
      display: grid;
      min-height: 220px;
      place-items: center;
      padding: 18px;
      border: 1px dashed rgba(255, 107, 87, 0.45);
      border-radius: 14px;
      background: #fff4ea;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .ad-slot strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 1rem;
    }

    .account-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--brand);
      font-size: 0.86rem;
      font-weight: 800;
      text-decoration: none;
    }

    .account-link:hover { color: var(--accent); }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 { margin: 8px 0 10px; font-size: clamp(1.8rem, 3vw, 2.35rem); }
    .intro { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }

    ul { margin: 0; padding-left: 24px; }

    li { padding: 14px 0 14px 6px; font-size: 1rem; }
    li::marker { color: var(--accent); font-weight: 900; }

    a.reviewer-link { color: var(--brand); font-weight: 800; }
    a.reviewer-link:hover { color: var(--accent); }

    .status {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ebfff3;
      color: #168868;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    @media (max-width: 620px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .content-grid { grid-template-columns: 1fr; }
      main { padding: 24px 20px; }
      .ads { position: static; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand" aria-label="BusyBagz brand logo">
        <span class="brand-mark">BB</span>
        <span class="brand-name">BusyBagz</span>
      </div>
      <a class="nav-link" href="/">Back to storefront</a>
    </header>

    <div class="content-grid">
      <main>
        <p class="eyebrow">Study library</p>
        <h1>Reviewers</h1>
        <p class="intro">Choose a reviewer to begin an interactive question-and-answer assessment.</p>
        <ul>
          <li>
            <a class="reviewer-link" href="/reviewer/ecommerce-cloud">SAP Commerce Cloud Reviewer</a>
            <span class="status">Current</span>
          </li>
        </ul>
      </main>

      <aside class="ads" aria-label="Advertisement">
        <span class="ads-label">Advertisement</span>
        <ins class="adsbygoogle ad-slot"
          data-ad-client="ca-pub-7446487671504565"
          data-ad-slot="9568789244"
          data-ad-format="auto"
          data-full-width-responsive="true"></ins>
        <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
        <a class="account-link" href="https://example.com/your-account" target="_blank" rel="noopener noreferrer">Visit my account</a>
      </aside>
    </div>
  </div>
</body>
</html>
