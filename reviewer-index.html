<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BusyBagz Reviewers</title>
  <meta name="description" content="BusyBagz reviewer resources, assessments, and product knowledge tools.">
  <link rel="canonical" href="https://busybagz.com/reviewer">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --bg: #eef3ff;
      --ink: #1d1a2b;
      --muted: #53608a;
      --brand: #1877f2;
      --accent: #0f5fc4;
      --line: rgba(36, 55, 130, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 72px 20px 72px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    .page-shell { max-width: 1280px; margin: 0 auto; padding-top: 20px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: -32px -20px 28px;
      min-height: 72px;
      padding: 0.8rem 4vw;
      border-radius: 0;
      background: #0f5fc4;
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 18px 30px rgba(27, 143, 102, 0.12);
    }

    .brand { display: flex; align-items: center; gap: 0.55rem; font-weight: 800; }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.3rem;
      height: 2.3rem;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      color: #6de3c5;
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: -0.12em;
    }

    .brand-name { font-size: 1.1rem; font-weight: 700; }

    .nav-link {
      color: white;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .breadcrumbs {
      position: sticky;
      top: 128px;
      z-index: 900;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 32px;
      margin-bottom: 1rem;
      padding: 0.5rem 0;
      background: var(--bg);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .breadcrumbs a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }

    .breadcrumbs a:hover { color: var(--accent); }
    .breadcrumbs .separator { opacity: 0.55; }
    .breadcrumbs .current { color: var(--ink); font-weight: 700; }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      width: 100%;
      margin-top: 40px;
    }

    main {
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: white;
      box-shadow: 0 20px 48px rgba(29, 29, 58, 0.1);
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 { margin: 8px 0 10px; font-size: clamp(1.8rem, 3vw, 2.35rem); }
    .intro { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }

    ul { margin: 0; padding-left: 24px; }

    li { padding: 14px 0 14px 6px; font-size: 1rem; }
    li::marker { color: var(--accent); font-weight: 900; }

    a.reviewer-link { color: var(--brand); font-weight: 800; }
    a.reviewer-link:hover { color: var(--accent); }

    .status {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #d9fff4;
      color: #007d70;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    @media (max-width: 620px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .content-grid { grid-template-columns: minmax(0, 1fr); margin-top: 0; }
      main { padding: 24px 20px; }
      .ads { position: static; }
      body { padding: 125px 12px 72px; }
      .page-shell { padding-top: 14px; }
      .breadcrumbs { top: 160px; margin-top: 90px; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand" aria-label="BusyBagz brand logo">
        <span class="brand-mark">BB</span>
        <span class="brand-name">BusyBagz</span>
      </div>
      <a class="nav-link" href="index.html">Back to storefront</a>
    </header>

    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span class="separator" aria-hidden="true">/</span>
      <span class="current" aria-current="page">Reviewer</span>
    </nav>

    <div class="content-grid">
      <main>
        <p class="eyebrow">Study library</p>
        <h1>Reviewers</h1>
        <p class="intro">Choose a reviewer to begin an interactive question-and-answer assessment.</p>
        <ul>
          <li>
            <a class="reviewer-link" href="reviewer.html">SAP Commerce Cloud Reviewer</a>
            <span class="status">Current</span>
          </li>
        </ul>
      </main>

    </div>
  </div>
  <script src="js/site-shell.js"></script>
</body>
</html>
